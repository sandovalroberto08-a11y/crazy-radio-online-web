<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crazy Radio Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;text-align:center}
.wrap{max-width:1024px;margin:auto;position:relative}
.art{display:block;width:100%;height:auto}
.hot{position:absolute;display:block;background:transparent;border:0;cursor:pointer}
/* Zonas clicables sobre el diseño */
.play{left:4.2%;top:40%;width:92%;height:10.8%}
.programas{left:4.4%;top:52.3%;width:21.8%;height:7.8%}
.mezclas{left:27.6%;top:52.3%;width:21.8%;height:7.8%}
.crossover{left:50.7%;top:52.3%;width:21.8%;height:7.8%}
.whatsappnote{left:73.9%;top:52.3%;width:21.8%;height:7.8%}
.whatsapp{left:7.2%;top:77.1%;width:86%;height:7.4%}
.tiktok{left:33%;top:89.5%;width:7.2%;height:4.8%}
.instagram{left:42.2%;top:89.5%;width:7.8%;height:4.8%}
.facebook{left:53.2%;top:89.5%;width:7.8%;height:4.8%}
.youtube{left:64.2%;top:89.5%;width:7.8%;height:4.8%}
.audio{position:fixed;left:-9999px}
.panel{display:none;position:fixed;inset:0;background:#000d;z-index:10;align-items:center;justify-content:center;padding:18px}
.panel article{background:#111;border:2px solid #ffd400;border-radius:18px;padding:24px;max-width:520px;width:100%;color:#fff}
.panel p{white-space:pre-line;line-height:1.6}.panel h2{color:#ffd400}.panel button{background:#ffd400;color:#050505;border:0;border-radius:30px;padding:12px 22px;font-weight:bold;cursor:pointer}
.status{padding:10px;color:#ffd400}

.volume-panel{max-width:1024px;margin:0 auto 18px;padding:14px 18px;background:#111;border:1px solid #ffd400;border-radius:12px;color:#ffd400;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.volume-panel label{font-weight:bold;white-space:nowrap}
.volume-panel input[type=range]{width:min(340px,70vw);accent-color:#ffd400;cursor:pointer}
.eq-bars{height:48px;display:flex;align-items:flex-end;gap:5px;width:180px;justify-content:center}
.eq-bars span{display:block;width:9px;height:5px;background:#ffd400;border-radius:3px;transition:height .15s}
.eq-bars.active span{animation:eqbounce .55s ease-in-out infinite alternate}
.eq-bars.active span:nth-child(2n){animation-delay:.12s}.eq-bars.active span:nth-child(3n){animation-delay:.24s}.eq-bars.active span:nth-child(4n){animation-delay:.08s}
@keyframes eqbounce{from{height:6px}to{height:var(--bar-height,35px)}}
</style></head><body>
